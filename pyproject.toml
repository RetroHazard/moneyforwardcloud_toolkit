[project]
name = "mfcloud"
version = "0.1.0"
description = "English-first Python toolkit for the Money Forward Cloud Accounting API (v3)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "RetroHazard" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "keyring>=25",
    "fastmcp>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyyaml>=6",
]

[project.scripts]
mfc = "mfcloud.cli.app:main"
mfc-mcp = "mfcloud.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mfcloud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
