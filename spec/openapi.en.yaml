  /api/v3/transactions:
    get:
      deprecated: false
      description: 'Retrieves the list of transactions collected by connected services.

        To narrow down by connected service, specify connected_account_id or connected_sub_account_id.

        '
      operationId: getTransactions
      parameters:
      - description: Specifies the start date of the retrieval range (YYYY-MM-DD format). The difference
          from end_date must be within 366 days.
        in: query
        name: start_date
        required: true
        schema:
          example: '2024-04-01'
          format: date
          type: string
      - description: Specifies the end date of the retrieval range (YYYY-MM-DD format). The difference
          from start_date must be within 366 days.
        in: query
        name: end_date
        required: true
        schema:
          example: '2025-03-31'
          format: date
          type: string
      - description: Specifies the ID of the connected service to filter by. Cannot be specified together
          with connected_sub_account_id.
        in: query
        name: connected_account_id
        required: false
        schema:
          example: BowMhLnFvzZ1y9TeF5%2B3QQ%3D%3D
          type: string
      - description: Specifies the ID of the account to filter by. If omitted, all accounts linked to
          the connected_account_id are targeted. Cannot be specified together with connected_account_id.
        in: query
        name: connected_sub_account_id
        required: false
        schema:
          example: Sb0m10vvYk2dUdLU8aGxgQ%3D%3D
          type: string
      - description: Minimum amount (yen). If specified, side is required.
        in: query
        name: value_min
        required: false
        schema:
          example: 1000
          maximum: 999999999999
          minimum: 0
          type: integer
      - description: Maximum amount (JPY). If specified, side is required.
        in: query
        name: value_max
        required: false
        schema:
          example: 100000
          maximum: 999999999999
          minimum: 0
          type: integer
      - description: Filters by the income/expense type of the transaction. If value_min and value_max
          are omitted, the full range of the specified income/expense type is applied. Required when value_min
          or value_max is specified.
        in: query
        name: side
        required: false
        schema:
          enum:
          - INCOME
          - EXPENSE
          example: EXPENSE
          type: string
      - description: Filters by transaction content. The match method is specified with content_match_type.
        in: query
        name: content
        required: false
        schema:
          example: Supermarket
          type: string
      - description: 'Specifies the matching method for transaction content. Ignored if content is not
          specified.<br />

          - exact: exact match<br />

          - partial: partial match (default)<br />

          - forward: prefix match<br />

          - backward: suffix match'
        in: query
        name: content_match_type
        required: false
        schema:
          default: partial
          enum:
          - exact
          - partial
          - forward
          - backward
          example: partial
          type: string
      - description: 'Filters by journalizing status (multiple values allowed). If omitted, all statuses
          are included.<br />

          - excluded: excluded from journalizing<br />

          - none: not yet journalized<br />

          - registered: journalized<br />

          - modified: the transaction was modified after journalizing<br />

          - new_voucher_attached: the first voucher was attached after journalizing'
        explode: true
        in: query
        name: journalizing_statuses
        required: false
        schema:
          example:
          - none
          - registered
          items:
            enum:
            - excluded
            - none
            - registered
            - modified
            - new_voucher_attached
            type: string
          type: array
        style: form
      - description: Specifies the sort order by transaction date. If omitted, desc is applied.
        in: query
        name: order
        required: false
        schema:
          default: desc
          enum:
          - asc
          - desc
          example: desc
          type: string
      - description: Page number
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 2
          minimum: 1
          type: integer
          x-go-type: uint64
      - description: 'Number of items per page (default: 50, minimum: 10, maximum: 1000)'
        in: query
        name: per_page
        required: false
        schema:
          default: 50
          example: 50
          maximum: 1000
          minimum: 10
          type: integer
          x-go-type: uint64
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTransactionsResponse'
          description: Success
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse400'
          description: Invalid request parameters
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse401'
          description: Access token is not set, invalid, or expired
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse403'
          description: Cannot be used due to unauthorized permissions
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse429'
          description: Subject to rate limiting
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse500'
          description: Unexpected error
      security:
      - OAuth2:
        - mfc/accounting/transaction.read
      summary: Retrieve transaction list
      tags:
      - Transactions
    post:
      deprecated: false
      description: Creates transactions.
      operationId: postTransactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostTransactionsRequest'
        description: Request body
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostTransactionsResponse'
          description: Success
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionErrorResponse'
          description: Invalid request parameters
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse401'
          description: Access token is not set, invalid, or expired
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse403'
          description: Cannot be used due to unauthorized permissions
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request Content-Type is not supported
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse429'
          description: Subject to rate limiting
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse500'
          description: Unexpected error
      security:
      - OAuth2:
        - mfc/accounting/transaction.write
      summary: Create transactions
