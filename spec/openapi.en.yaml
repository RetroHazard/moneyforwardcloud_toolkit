components:
  parameters:
    Available:
      description: nil
      in: query
      name: available
      required: false
      schema:
        example: true
        type: boolean
    JournalStartDate:
      description: Specifies the start date of the target period. The transaction date of each journal
        entry is used as the basis.
      in: query
      name: start_date
      required: false
      schema:
        example: '2022-04-01'
        format: date
        type: string
    JournalEndDate:
      description: Specifies the end date of the target period. The transaction date of each journal entry
        is used as the basis.
      in: query
      name: end_date
      required: false
      schema:
        example: '2023-03-31'
        format: date
        type: string
    AccountIDJournal:
      description: 'Account ID<br />

        Only journal entries that have the specified account on either the debit or credit side are returned.'
      in: query
      name: account_id
      required: false
      schema:
        type: string
    IsRealized:
      description: 'Flag specifying whether the journal entry is unrealized<br />

        If not specified, all journal entries are returned.'
      in: query
      name: is_realized
      required: false
      schema:
        example: false
        type: boolean
    TransactionIds:
      description: Filters by transaction ID (multiple values allowed).
      explode: true
      in: query
      name: transaction_ids
      required: false
      schema:
        example:
        - BowMhLnFvzZ1y9TeF5%2B3QQ%3D%3D
        - CowMhLnFvzZ1y9TeF5%2B3QQ%3D%3D
        items:
          type: string
        maxItems: 50
        type: array
      style: form
    Page:
      description: Page number
      in: query
      name: page
      required: false
      schema:
        default: 1
        example: 2
        minimum: 1
        type: integer
        x-go-type: uint64
    JournalsPerPage:
      description: Number of items per page
      in: query
      name: per_page
      required: false
      schema:
        default: 10
        example: 10
        maximum: 10000
        minimum: 1
        type: integer
        x-go-type: uint64
    Id:
      description: Specify the required ID.
      in: path
      name: id
      required: true
      schema:
        type: string
    StartDate:
      description: Specifies the start date of the retrieval range (YYYY-MM-DD format). The difference
        from end_date must be within 366 days.
      in: query
      name: start_date
      required: true
      schema:
        example: '2024-04-01'
        format: date
        type: string
    EndDate:
      description: Specifies the end date of the retrieval range (YYYY-MM-DD format). The difference from
        start_date must be within 366 days.
      in: query
      name: end_date
      required: true
      schema:
        example: '2025-03-31'
        format: date
        type: string
    ConnectedAccountId:
      description: Specifies the ID of the connected service to filter by. Cannot be specified together
        with connected_sub_account_id.
      in: query
      name: connected_account_id
      required: false
      schema:
        example: BowMhLnFvzZ1y9TeF5%2B3QQ%3D%3D
        type: string
    ConnectedSubAccountId:
      description: Specifies the ID of the account to filter by. If omitted, all accounts linked to the
        connected_account_id are targeted. Cannot be specified together with connected_account_id.
      in: query
      name: connected_sub_account_id
      required: false
      schema:
        example: Sb0m10vvYk2dUdLU8aGxgQ%3D%3D
        type: string
    ValueMin:
      description: Minimum amount (yen). If specified, side is required.
      in: query
      name: value_min
      required: false
      schema:
        example: 1000
        maximum: 999999999999
        minimum: 0
        type: integer
    ValueMax:
      description: Maximum amount (JPY). If specified, side is required.
      in: query
      name: value_max
      required: false
      schema:
        example: 100000
        maximum: 999999999999
        minimum: 0
        type: integer
    Side:
      description: Filters by the income/expense type of the transaction. If value_min and value_max are
        omitted, the full range of the specified income/expense type is applied. Required when value_min
        or value_max is specified.
      in: query
      name: side
      required: false
      schema:
        enum:
        - INCOME
        - EXPENSE
        example: EXPENSE
        type: string
    Content:
      description: Filters by transaction content. The match method is specified with content_match_type.
      in: query
      name: content
      required: false
      schema:
        example: Supermarket
        type: string
    ContentMatchType:
      description: 'Specifies the matching method for transaction content. Ignored if content is not specified.<br
        />

        - exact: exact match<br />

        - partial: partial match (default)<br />

        - forward: prefix match<br />

        - backward: suffix match'
      in: query
      name: content_match_type
      required: false
      schema:
        default: partial
        enum:
        - exact
        - partial
        - forward
        - backward
        example: partial
        type: string
    JournalizingStatuses:
      description: 'Filters by journalizing status (multiple values allowed). If omitted, all statuses
        are included.<br />

        - excluded: excluded from journalizing<br />

        - none: not yet journalized<br />

        - registered: journalized<br />

        - modified: the transaction was modified after journalizing<br />

        - new_voucher_attached: the first voucher was attached after journalizing'
      explode: true
      in: query
      name: journalizing_statuses
      required: false
      schema:
        example:
        - none
        - registered
        items:
          enum:
          - excluded
          - none
          - registered
          - modified
          - new_voucher_attached
          type: string
        type: array
      style: form
    Order:
      description: Specifies the sort order by transaction date. If omitted, desc is applied.
      in: query
      name: order
      required: false
      schema:
        default: desc
        enum:
        - asc
        - desc
        example: desc
        type: string
    TransactionsPerPage:
      description: 'Number of items per page (default: 50, minimum: 10, maximum: 1000)'
      in: query
      name: per_page
      required: false
      schema:
        default: 50
        example: 50
        maximum: 1000
        minimum: 10
        type: integer
        x-go-type: uint64
    AccountIDSubAccount:
      description: Account ID
      in: query
      name: account_id
      required: false
      schema:
        type: string
    FiscalYearTB:
      description: 'Specifies the fiscal year.<br />

        If not specified, the latest fiscal year is used.'
      example: 2022
      in: query
      name: fiscal_year
      required: false
      schema:
        type: integer
        x-go-type: uint64
    StartMonthTB:
      description: 'Specifies the aggregation start month of the target fiscal year.<br />

        Can be combined with `fiscal_year` to specify the aggregation start month.<br />

        If not specified, the start month of the fiscal year is used.'
      in: query
      name: start_month
      required: false
      schema:
        example: 2
        type: integer
    EndMonthTB:
      description: 'Specifies the aggregation end month of the target fiscal year.<br />

        Can be combined with `fiscal_year` to specify the aggregation end month.<br />

        If not specified, the end month of the fiscal year is used.'
      in: query
      name: end_month
      required: false
      schema:
        example: 2
        type: integer
    TrialBalanceStartDate:
      description: Specifies the start date of the target period.
      in: query
      name: start_date
      required: false
      schema:
        example: '2022-04-01'
        format: date
        type: string
    TrialBalanceEndDate:
      description: Specifies the end date of the target period.
      in: query
      name: end_date
      required: false
      schema:
        example: '2023-03-31'
        format: date
        type: string
    WithSubAccounts:
      description: Specifies whether to retrieve the amounts of sub-accounts linked to accounts.
      in: query
      name: with_sub_accounts
      required: false
      schema:
        default: false
        example: true
        type: boolean
    IncludeTax:
      description: 'Specifies whether to calculate on a tax-inclusive basis.<br />

        Can only be specified when "Office Settings > Accounting Method" is 「税抜（内税）」 (tax-exclusive, internal
        tax).<br />

        For the 「税込」 (tax-inclusive) and 「税抜（別記）」 (tax-exclusive, separately stated) accounting methods,
        this parameter is ignored.'
      in: query
      name: include_tax
      required: false
      schema:
        default: false
        example: true
        type: boolean
    JournalTypes:
      description: 'Specifies the type of journal entries to target.<br />

        You can specify either `journal_entry` (normal journal entries) or `adjusting_entry` (closing
        adjustment entries), or both.<br />

        If omitted, both types are targeted.'
      in: query
      name: journal_types
      required: false
      schema:
        example:
        - journal_entry
        - adjusting_entry
        items:
          enum:
          - journal_entry
          - adjusting_entry
          type: string
          x-go-type: string
        type: array
    TransitionType:
      description: 'Specifies the aggregation type of the transition report.<br />

        Currently only ''monthly'' is supported.<br />

        - monthly: monthly aggregation'
      in: query
      name: type
      required: true
      schema:
        enum:
        - monthly
        example: monthly
        type: string
    TransitionFiscalYear:
      description: 'Specifies the fiscal year.<br />

        If not specified, the latest fiscal year is used.'
      example: 2021
      in: query
      name: fiscal_year
      required: false
      schema:
        type: integer
        x-go-type: uint64
    TransitionStartMonth:
      description: 'Specifies the aggregation start month of the target fiscal year.<br />

        Can be combined with `fiscal_year` to specify the aggregation start month.<br />

        If not specified, the start month of the fiscal year is used.'
      in: query
      name: start_month
      required: false
      schema:
        example: 2
        type: integer
    TransitionEndMonth:
      description: 'Specifies the aggregation end month of the target fiscal year.<br />

        Can be combined with `fiscal_year` to specify the aggregation end month.<br />

        If not specified, the end month of the fiscal year is used.'
      in: query
      name: end_month
      required: false
      schema:
        example: 2
        type: integer
