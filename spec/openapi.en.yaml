openapi: 3.0.3
info:
  contact:
    name: ca_public_api
    url: https://api-accounting.moneyforward.com
  description: '# Basic Information

    Please note that, as a rule, we do not respond to individual inquiries or provide technical support,
    except for our partner companies.<br />


    # Release Notes

    New API features and important changes are announced in the [release notes](/release-notes).<br />

    To receive the latest updates, we recommend subscribing to the [RSS feed](/rss.xml).<br />


    # Downloading the API Specification

    If you need the text of this specification (yaml format) as input for generative AI, download it from
    <a download href="/v3/openapi.yaml">here</a>.<br />


    # Authentication

    All APIs perform authentication and authorization using OAuth 2.0.<br />

    Obtain an access token in accordance with OAuth 2.0.<br />

    API requests become possible by attaching the obtained access token to the Authorization header as
    a Bearer Token.<br />


    # Error Responses

    All APIs return three types of status codes (2xx, 4xx, 5xx).<br />

    For 4xx and 5xx, an error response body is returned in a common response format.<br />

    The error response contains an array with as many elements as there are errors, each containing a
    code indicating the error type and a message describing the error details.<br />


    # Rate limiter

    [Documentation link](/rate_limiter)

    '
