  /api/v3/reports/trial_balance_bs:
    get:
      description: "Retrieves the balance sheet of the trial balance.<br />\nAccounts and sub-accounts\
        \ whose amounts are 0 for all items, as well as some financial statement items, are not returned.<br\
        \ />\nThe trial balance columns\n \n - opening_balance(previous period balance)\n - debit_amount(debit\
        \ amount)\n - credit_amount(credit amount)\n - closing_balance(end-of-period balance)\n - ratio(composition\
        \ ratio)\n\nare returned as a fixed set.<br />\n\nAlso, unrealized journal entries are not included,\
        \ and figures are always aggregated as the total of all departments.<br />\n\nratio(composition\
        \ ratio) is null instead of 0 when the denominator is 0, as it cannot be calculated.<br />"
      operationId: getReportsTrialBalanceBalanceSheet
      parameters:
      - description: 'Specifies the fiscal year.<br />

          If not specified, the latest fiscal year is used.'
        example: 2022
        in: query
        name: fiscal_year
        required: false
        schema:
          type: integer
          x-go-type: uint64
      - description: 'Specifies the aggregation start month of the target fiscal year.<br />

          Can be combined with `fiscal_year` to specify the aggregation start month.<br />

          If not specified, the start month of the fiscal year is used.'
        in: query
        name: start_month
        required: false
        schema:
          example: 2
          type: integer
      - description: 'Specifies the aggregation end month of the target fiscal year.<br />

          Can be combined with `fiscal_year` to specify the aggregation end month.<br />

          If not specified, the end month of the fiscal year is used.'
        in: query
        name: end_month
        required: false
        schema:
          example: 2
          type: integer
      - description: Specifies the start date of the target period.
        in: query
        name: start_date
        required: false
        schema:
          example: '2022-04-01'
          format: date
          type: string
      - description: Specifies the end date of the target period.
        in: query
        name: end_date
        required: false
        schema:
          example: '2023-03-31'
          format: date
          type: string
      - description: Specifies whether to retrieve the amounts of sub-accounts linked to accounts.
        in: query
        name: with_sub_accounts
        required: false
        schema:
          default: false
          example: true
          type: boolean
      - description: 'Specifies whether to calculate on a tax-inclusive basis.<br />

          Can only be specified when "Office Settings > Accounting Method" is 「税抜（内税）」 (tax-exclusive,
          internal tax).<br />

          For the 「税込」 (tax-inclusive) and 「税抜（別記）」 (tax-exclusive, separately stated) accounting methods,
          this parameter is ignored.'
        in: query
        name: include_tax
        required: false
        schema:
          default: false
          example: true
          type: boolean
      - description: 'Specifies the type of journal entries to target.<br />

          You can specify either `journal_entry` (normal journal entries) or `adjusting_entry` (closing
          adjustment entries), or both.<br />

          If omitted, both types are targeted.'
        in: query
        name: journal_types
        required: false
        schema:
          example:
          - journal_entry
          - adjusting_entry
          items:
            enum:
            - journal_entry
            - adjusting_entry
            type: string
            x-go-type: string
          type: array
