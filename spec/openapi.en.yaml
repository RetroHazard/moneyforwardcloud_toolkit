  /api/v3/journals:
    get:
      deprecated: false
      description: 'Retrieves a list of journal entries by specifying conditions such as the accounting
        period and journal entry date.<br />

        Either start_date or end_date must be specified. Only journal entries in the accounting period
        that contains the specified date are returned.'
      operationId: getJournals
      parameters:
      - description: Specifies the start date of the target period. The transaction date of each journal
          entry is used as the basis.
        in: query
        name: start_date
        required: false
        schema:
          example: '2022-04-01'
          format: date
          type: string
      - description: Specifies the end date of the target period. The transaction date of each journal
          entry is used as the basis.
        in: query
        name: end_date
        required: false
        schema:
          example: '2023-03-31'
          format: date
          type: string
      - description: 'Account ID<br />

          Only journal entries that have the specified account on either the debit or credit side are
          returned.'
        in: query
        name: account_id
        required: false
        schema:
          type: string
      - description: 'Flag specifying whether the journal entry is unrealized<br />

          If not specified, all journal entries are returned.'
        in: query
        name: is_realized
        required: false
        schema:
          example: false
          type: boolean
      - description: Filters by transaction ID (multiple values allowed).
        explode: true
        in: query
        name: transaction_ids
        required: false
        schema:
          example:
          - BowMhLnFvzZ1y9TeF5%2B3QQ%3D%3D
          - CowMhLnFvzZ1y9TeF5%2B3QQ%3D%3D
          items:
            type: string
          maxItems: 50
          type: array
        style: form
      - description: Page number
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 2
          minimum: 1
          type: integer
          x-go-type: uint64
      - description: Number of items per page
        in: query
        name: per_page
        required: false
        schema:
          default: 10
          example: 10
          maximum: 10000
          minimum: 1
          type: integer
          x-go-type: uint64
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetJournalsResponse'
          description: Success
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getJournals_400_response'
          description: Invalid request parameters
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse401'
          description: Access token is not set, invalid, or expired
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse403'
          description: Cannot be used due to unauthorized permissions
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse429'
          description: Subject to rate limiting
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse500'
          description: Unexpected error
      security:
      - OAuth2:
        - mfc/accounting/journal.read
      summary: Retrieve journal entry list
      tags:
      - Journals
    post:
      deprecated: false
      description: Creates a journal entry.
